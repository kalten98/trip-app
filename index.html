<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taipei 台北">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Taipei Trip 台北</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f7; --card: #ffffff; --ink: #1b1d21; --muted: #5f6672; --line: #e7e9ee;
    --accent: #ff5a1f; --accent-soft: #fff1ea; --teal: #0e9f8a; --teal-soft: #e6f6f3;
    --blue: #2f6fec; --blue-soft: #eaf1fe; --violet: #7b5cf0; --violet-soft: #f1edfe;
    --amber: #e8a100; --amber-soft: #fff6dd; --rose: #e2456b; --rose-soft: #fdebf0;
    --warn: #b45309; --warn-soft: #fff4e0; --ok: #15803d; --ok-soft: #e8f7ee; --bad: #b91c1c; --bad-soft: #fdecec;
    --radius: 18px; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.06);
    --tab-h: 74px;
    --font: "Plus Jakarta Sans", "Noto Sans TC", sans-serif;
    --font-zh: "Noto Sans TC", "Plus Jakarta Sans", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 500 17px/1.45 var(--font); }
  body { padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom)); overflow-x: hidden; }
  .zh { font-family: var(--font-zh); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }

  /* ---------- top bar ---------- */
  .top { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.94); backdrop-filter: blur(10px);
         border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
  .top .wrap { display: flex; align-items: center; gap: 12px; height: 60px; }
  .brand { font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
  .brand small { display: block; font-weight: 600; font-size: 16px; color: var(--muted); letter-spacing: 0; }
  .top .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff;
          border-radius: 999px; padding: 7px 12px; font-size: 16px; font-weight: 600; cursor: pointer; white-space: nowrap; }

  /* ---------- preview-day strip (mock only) ---------- */
  .preview { background: var(--violet-soft); border-bottom: 1px solid #e3dbfd; }
  .preview .wrap { display: flex; gap: 8px; align-items: center; overflow-x: auto; padding-top: 8px; padding-bottom: 8px; scrollbar-width: none; }
  .preview .wrap::-webkit-scrollbar { display: none; }
  .preview b { color: var(--violet); font-size: 16px; white-space: nowrap; }
  .chip { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px;
          font-size: 16px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* ---------- cards ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .section { margin-top: 18px; }
  .section h2 { font-size: 20px; font-weight: 800; margin: 0 0 10px; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 8px; }
  .section h2 .zh { font-size: 17px; color: var(--muted); font-weight: 700; }
  .muted { color: var(--muted); }
  .small { font-size: 16px; }

  /* ---------- hero ---------- */
  .hero { margin-top: 14px; border-radius: 22px; padding: 18px; color: #fff; position: relative; overflow: hidden;
          background: radial-gradient(120% 140% at 100% 0%, #ffb26b 0%, #ff6a2b 45%, #e5432c 100%); box-shadow: var(--shadow); }
  .hero::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 220px; height: 220px; border-radius: 50%;
                 background: rgba(255,255,255,.12); }
  .hero .kicker { font-size: 16px; font-weight: 700; opacity: .92; }
  .hero h1 { margin: 4px 0 2px; font-size: 27px; line-height: 1.15; letter-spacing: -.02em; font-weight: 800; }
  .hero .sub { font-size: 17px; opacity: .95; }
  .hero .stats { display: flex; gap: 10px; margin-top: 14px; position: relative; z-index: 1; flex-wrap: wrap; }
  .hero .stat { background: rgba(255,255,255,.18); border-radius: 12px; padding: 8px 12px; font-size: 16px; font-weight: 700; }

  /* ---------- icon row ---------- */
  .icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .ic { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 0; cursor: pointer; }
  .ic .tile { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; }
  .ic svg { width: 28px; height: 28px; }
  .ic span { font-size: 16px; font-weight: 700; }
  .t-orange { background: var(--accent-soft); color: var(--accent); } .t-teal { background: var(--teal-soft); color: var(--teal); }
  .t-blue { background: var(--blue-soft); color: var(--blue); } .t-violet { background: var(--violet-soft); color: var(--violet); }
  .t-amber { background: var(--amber-soft); color: var(--amber); } .t-rose { background: var(--rose-soft); color: var(--rose); }

  /* ---------- next-up ---------- */
  .next .label { font-size: 16px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
  .next .time { font-size: 31px; font-weight: 800; letter-spacing: -.02em; }
  .next .what { font-size: 19px; font-weight: 700; margin-top: 2px; }
  .names { margin-top: 6px; }
  .names .en { font-weight: 700; font-size: 17px; }
  .names .zh { font-size: 17px; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px;
         border-radius: 12px; border: 1px solid var(--line); background: #fff; font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn svg { width: 18px; height: 18px; }

  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 700; border-radius: 8px; padding: 2px 8px; }
  .b-warn { background: var(--warn-soft); color: var(--warn); } .b-ok { background: var(--ok-soft); color: var(--ok); }
  .b-bad { background: var(--bad-soft); color: var(--bad); } .b-info { background: var(--blue-soft); color: var(--blue); }

  /* ---------- horizontal cards ---------- */
  .hscroll { display: flex; gap: 10px; overflow-x: auto; padding: 2px 16px 6px; margin: 0 -16px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .hscroll::-webkit-scrollbar { display: none; }
  .mini { flex: none; width: 70%; max-width: 260px; scroll-snap-align: start; }
  .mini .t { font-weight: 800; font-size: 17px; }
  .mini .d { font-size: 16px; color: var(--muted); margin-top: 2px; }

  /* ---------- plan ---------- */
  .daytabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px; margin: 0 -16px; scrollbar-width: none; }
  .daytabs::-webkit-scrollbar { display: none; }
  .dt { flex: none; min-width: 64px; text-align: center; border-radius: 14px; background: #fff; border: 1px solid var(--line);
        padding: 8px 10px; cursor: pointer; }
  .dt .dw { font-size: 16px; font-weight: 700; color: var(--muted); }
  .dt .dd { font-size: 21px; font-weight: 800; }
  .dt.on { background: var(--ink); border-color: var(--ink); color: #fff; } .dt.on .dw { color: #d7dbe2; }
  .dt.spare { border-style: dashed; }
  .dayhead h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
  .dayhead .zh { font-size: 18px; color: var(--muted); font-weight: 700; }
  .note { display: flex; gap: 10px; align-items: flex-start; border-radius: 14px; padding: 12px; font-size: 16px; margin-top: 10px; }
  .note svg { flex: none; width: 20px; height: 20px; margin-top: 1px; }
  .n-rain { background: var(--blue-soft); color: #1d4ed8; } .n-mrt { background: var(--teal-soft); color: #0b6b5d; }
  .n-why { background: var(--amber-soft); color: #8a5a00; }

  .timeline { position: relative; margin-top: 14px; }
  .item { display: grid; grid-template-columns: 56px 1fr; gap: 10px; position: relative; }
  .item + .item { margin-top: 10px; }
  .item .tm { font-weight: 800; font-size: 17px; padding-top: 14px; text-align: right; }
  .item .card { padding: 14px; }
  .kind { display: inline-flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 800; }
  .kind svg { width: 18px; height: 18px; }
  .k-visit { color: var(--blue); } .k-meal { color: var(--accent); } .k-travel { color: var(--teal); } .k-rest { color: var(--violet); }
  .k-hotel { color: var(--violet); } .k-flight { color: var(--ink); }
  .item .txt { font-weight: 700; font-size: 17px; margin-top: 4px; }
  .item .tr { font-size: 16px; color: var(--muted); margin-top: 4px; }

  .meal-opts { display: grid; gap: 8px; margin-top: 10px; }
  .opt { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
  .opt .tag { font-size: 16px; font-weight: 800; border-radius: 8px; padding: 2px 8px; }
  .opt.main { border-color: #ffd2bf; background: var(--accent-soft); }
  .opt.main .tag { background: var(--accent); color: #fff; } .opt .tag { background: #eef0f3; color: var(--muted); }
  .opt .nm .en { font-weight: 700; font-size: 16px; } .opt .nm .zh { font-size: 16px; color: var(--muted); }
  .iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; cursor: pointer; }
  .iconbtn svg { width: 20px; height: 20px; }

  details.picks { margin-top: 14px; }
  details.picks summary { list-style: none; cursor: pointer; font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  details.picks summary::-webkit-details-marker { display: none; }
  #view summary svg { width: 22px; height: 22px; flex: none; }
  .pick { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .pick:first-of-type { border-top: 0; }
  .pick .grow { flex: 1; min-width: 0; }
  .pick .en { font-weight: 700; font-size: 16px; } .pick .zh { font-size: 16px; color: var(--muted); }

  /* ---------- placeholder tabs ---------- */
  .soon { text-align: center; padding: 40px 18px; }
  .soon svg { width: 54px; height: 54px; color: var(--muted); }
  .soon h2 { margin: 10px 0 6px; font-size: 22px; }

  /* ---------- tab bar ---------- */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 1px solid var(--line);
            padding-bottom: env(safe-area-inset-bottom); }
  .tabbar .wrap { display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tab-h); padding: 0 4px; }
  .tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: #8a909b; }
  .tab svg { width: 26px; height: 26px; }
  .tab span { font-size: 16px; font-weight: 700; }
  .tab.on { color: var(--accent); }

  /* ---------- sheets (taxi / mrt / info) ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(15,18,25,.45); z-index: 40; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: #fff; border-radius: 22px 22px 0 0;
           max-height: 88vh; overflow-y: auto; padding: 10px 0 calc(18px + env(safe-area-inset-bottom)); transform: translateY(110%); transition: transform .25s ease; }
  .sheet.open { transform: none; } .scrim.open { display: block; }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: #d9dce2; margin: 4px auto 10px; }
  .taxi-zh { font-family: var(--font-zh); font-size: 33px; font-weight: 700; line-height: 1.3; margin: 8px 0; word-break: break-word; }
  .taxi-say { font-family: var(--font-zh); font-size: 23px; font-weight: 700; color: var(--accent); }
  .exit { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .exit .no { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; }
  .exit.ok .no { background: var(--ok-soft); color: var(--ok); } .exit.bad .no { background: var(--bad-soft); color: var(--bad); }
  .exit.rec .no { background: var(--ok); color: #fff; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
           background: var(--ink); color: #fff; border-radius: 12px; padding: 10px 14px; font-size: 16px; font-weight: 600; z-index: 50;
           opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.on { opacity: 1; }
  .loading { padding: 60px 16px; text-align: center; color: var(--muted); }
  .mtabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); margin: 6px -16px 0; padding: 0 16px; background: #fff; }
  .mtabs button { border: 0; background: none; min-height: 52px; font-size: 19px; font-weight: 600; color: var(--ink); cursor: pointer; position: relative; }
  .mtabs button.on { font-weight: 800; }
  .mtabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 4px; border-radius: 2px; background: var(--ink); }
  .crow { display: flex; gap: 10px; align-items: center; overflow-x: auto; padding: 14px 16px 6px; margin: 0 -16px; scrollbar-width: none; }
  .crow::-webkit-scrollbar { display: none; }
  .cp { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #d6d9df;
        background: #fff; font-size: 18px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--ink); }
  .cp svg { width: 20px; height: 20px; }
  .cp.on { background: #141a26; border-color: #141a26; color: #fff; }
  .cplus { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #e9ebf0; display: grid; place-items: center; cursor: pointer; }
  .cplus svg { width: 22px; height: 22px; }
  .ovday { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; cursor: pointer; }
  .ovday .dd { text-align: center; border-radius: 14px; background: var(--bg); padding: 6px 0; }
  .ovday .dd b { display: block; font-size: 23px; line-height: 1.1; } .ovday .dd span { font-size: 16px; color: var(--muted); font-weight: 700; }
  .ovday .t { font-weight: 800; font-size: 18px; } .ovday .s { font-size: 16px; color: var(--muted); }
  .codebox { width: 100%; min-height: 50px; border: 1.5px solid #d6d9df; border-radius: 12px; padding: 0 14px; font: 700 20px var(--font); letter-spacing: .12em; margin-top: 10px; }
  .mapwrap { position: relative; margin: 10px -16px 0; isolation: isolate; z-index: 0; }
  #map { height: calc(100vh - 230px - env(safe-area-inset-bottom)); min-height: 380px; background: #e8ecef; }
  .mapbtn { position: absolute; right: 12px; bottom: 16px; z-index: 500; }
  .leaflet-popup-content { font: 600 16px/1.4 var(--font); margin: 12px 14px; }
  .leaflet-popup-content .zh { color: var(--muted); }
  .leaflet-popup-content .btn { min-height: 40px; padding: 0 10px; font-size: 16px; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 16px; margin-top: 8px; }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 4px; vertical-align: -2px; }
  .phr { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 14px; margin-top: 8px; cursor: pointer; }
  .phr .zh { font-size: 21px; font-weight: 700; color: var(--ink); } .phr .en { font-size: 16px; color: var(--muted); }
  .bigsay { font-family: var(--font-zh); font-size: 40px; font-weight: 700; line-height: 1.3; margin: 10px 0; }
  .swapbar svg { width: 22px; height: 22px; flex: none; }
  .lock span svg { width: 26px; height: 26px; }
  .swapbar { display: flex; align-items: center; gap: 10px; background: var(--violet-soft); color: #4c32c7; border-radius: 14px; padding: 12px; margin-top: 10px; font-size: 16px; font-weight: 700; }
  .field { display: block; margin-top: 12px; }
  .field > span { display: block; font-weight: 800; font-size: 16px; margin-bottom: 6px; }
  .inp { width: 100%; min-height: 48px; border: 1.5px solid #d6d9df; border-radius: 12px; padding: 10px 14px; font: 600 18px var(--font); background: #fff; color: var(--ink); }
  textarea.inp { min-height: 90px; resize: vertical; }
  .stars button { border: 0; background: none; font-size: 30px; padding: 0 4px; cursor: pointer; color: #d6d9df; }
  .stars button.on { color: #e8a100; }
  .thumb { width: 100%; border-radius: 12px; margin-top: 8px; display: block; }
  .entry { padding: 12px 0; border-top: 1px solid var(--line); }
  .entry:first-child { border-top: 0; }
  .entry .who { font-size: 16px; color: var(--muted); }
  .tot { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 17px; }
  .tot b { text-align: right; }
  .banner { display: flex; gap: 10px; align-items: flex-start; background: var(--rose-soft); color: #9d1b3f; border-radius: 14px; padding: 12px; margin-top: 12px; cursor: pointer; }
  .banner svg { width: 22px; height: 22px; flex: none; }
  .bk { border-top: 1px solid var(--line); padding: 10px 0; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .bk:first-of-type { border-top: 0; }
  .bk .v { font-weight: 800; font-size: 18px; word-break: break-all; }
  .qnote { background: var(--amber-soft); color: #8a5a00; border-radius: 12px; padding: 10px 12px; font-size: 16px; margin-top: 10px; }
  .ticker { display: flex; align-items: center; gap: 10px; margin: 12px 0 0; background: var(--rose-soft); color: #9d1b3f; border-radius: 14px; padding: 10px 12px; overflow: hidden; cursor: pointer; }
  .ticker > svg { width: 22px; height: 22px; flex: none; }
  .ticker .win { overflow: hidden; flex: 1; min-width: 0; }
  .ticker .track { display: inline-block; white-space: nowrap; padding-left: 100%; font-size: 17px; font-weight: 700; animation: tick var(--dur, 18s) linear infinite; }
  .ticker .track b { font-weight: 800; }
  @keyframes tick { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  @media (prefers-reduced-motion: reduce) { .ticker .track { animation: none; padding-left: 0; white-space: normal; } }
  .offline { display: none; background: #141a26; color: #fff; font-size: 16px; font-weight: 700; text-align: center; padding: 8px 16px; }
  .offline.on { display: block; }
  .wx { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .wx:first-of-type { border-top: 0; }
  .wx .ico { font-size: 26px; width: 34px; text-align: center; }
  .wx b { font-size: 18px; }
  .guide summary { cursor: pointer; font-weight: 800; font-size: 19px; list-style: none; display: flex; align-items: center; gap: 8px; }
  .guide summary::-webkit-details-marker { display: none; }
  .guide summary svg { width: 22px; height: 22px; flex: none; color: var(--brand, #f2541b); }
  .guide summary .zh { white-space: nowrap; }
  .guide summary::after { content: "▾"; margin-left: auto; color: var(--muted); }
  .guide[open] summary::after { content: "▴"; }
  .guide ol { padding-left: 24px; margin: 10px 0 0; }
  .guide li { margin: 10px 0; line-height: 1.45; }
  .guide li b { display: block; }
  .install { display: flex; gap: 12px; align-items: flex-start; }
  .install img { width: 48px; height: 48px; border-radius: 12px; flex: none; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: #e9ebf0; border-radius: 14px; padding: 4px; margin-top: 14px; }
  .seg button { border: 0; background: none; border-radius: 11px; min-height: 42px; font-weight: 800; font-size: 17px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(16,24,40,.12); }
  .mi { display: inline-flex; align-items: center; gap: 3px; font-weight: 800; font-size: 16px; border-radius: 8px; padding: 2px 7px; }
  .mi svg { width: 17px; height: 17px; }
  .mi.lift { background: var(--blue-soft); color: var(--blue); } .mi.esc { background: var(--teal-soft); color: var(--teal); }
  .mi.stairs { background: var(--bad-soft); color: var(--bad); }
  .mrtbtn { width: 100%; justify-content: flex-start; flex-wrap: wrap; gap: 8px 12px; padding: 8px 12px; text-align: left; }

  // ---------- HOME ----------
  function nowInfo() {

    var tp = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Taipei" }));
    var iso = tp.getFullYear() + "-" + String(tp.getMonth() + 1).padStart(2, "0") + "-" + String(tp.getDate()).padStart(2, "0");
    var idx = T.days.map(function (d) { return d.date; }).indexOf(iso);
    if (idx >= 0) return { idx: idx, time: String(tp.getHours()).padStart(2, "0") + ":" + String(tp.getMinutes()).padStart(2, "0"), live: true };
    return { idx: state.previewIdx, time: String(tp.getHours()).padStart(2, "0") + ":" + String(tp.getMinutes()).padStart(2, "0"), live: false };
  }
  function blockAt(d, now) {
    var items = d.items, cur = null, nxt = null;
    for (var i = 0; i < items.length; i++) { if (items[i].time <= now) cur = i; else { nxt = i; break; } }
    return { cur: cur == null ? null : items[cur], next: nxt == null ? null : items[nxt] };
  }
  function toMin(t) { var p = t.split(":"); return +p[0] * 60 + +p[1]; }
  function fmtTime(t) { t = String(t || ""); var m = t.match(/(\d{4})-(\d\d)-(\d\d)[T ](\d\d):(\d\d)/); if (!m) return t; return (+m[3]) + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m[2] - 1] + " " + m[4] + ":" + m[5]; }
  function groupNo() { var r = (AUTH.bookings || []).filter(function (x) { return x.card === "group"; })[0]; return r ? r.value : ""; }
  var MSG = { rows: [], unread: null, timer: null };

    api("msg_list").then(function (j) {

    }, function () {});
    flushQueue();
  }

          '<div class="actions"><a class="btn" href="' + gmaps(s) + '" target="_blank" rel="noopener">' + ICON.go + 'Go</a></div></div>';
      }).join("") : '<div class="card mini"><div class="d">No saved places within 1.2 km.</div></div>') + '</div></section>';

    html += '<section class="section"><h2>Today <span class="zh">今日行程</span></h2><div class="card">' +
      d.items.map(function (it) {

      if (!AUTH.ok || !AUTH.bookings) return infoSheet("Bookings 訂單", '<div class="card lock"><span style="color:var(--accent)">' + ICON.lock + '</span><div><div class="small muted">Group booking no.</div><div class="n">' + esc(T.booking_masked) + '</div></div></div>' +
        '<div class="card" style="margin-top:10px"><label class="field" style="margin-top:0"><span>Group code</span><input id="gcode" class="inp codebox" type="password" autocomplete="off" placeholder="Enter the group code"></label>' +
        '<div class="actions"><button class="btn primary" data-unlock="bookings">' + ICON.lock + 'Unlock</button></div><div class="small muted" style="margin-top:8px">The code is remembered on this phone. Booking details are loaded from the private trip folder, never stored in the public app.</div></div>');
      var groups = {}, order = [];
      AUTH.bookings.forEach(function (r) { if (!groups[r.card]) { groups[r.card] = []; order.push(r.card); } groups[r.card].push(r); });
      var title = { group: "Group booking", flight_out: "Flight out", flight_back: "Flight back", hotel: "Hotel", transfer_sg: "Airport van · Singapore 新加坡機場接送", transfer_in: "Airport van · 3 Jan Taoyuan → hotel 機場接機", transfer_out: "Airport van · 8 Jan hotel → Taoyuan 機場送機" };
      return infoSheet("Bookings 訂單", order.map(function (c) {
        var rows = groups[c], files = rows.filter(function (r) { return r.file; });
        return '<div class="card" style="margin-bottom:10px"><div class="kind k-' + (c === "hotel" ? "hotel" : c === "group" ? "meal" : "flight") + '">' + (c === "hotel" ? ICON.hotel : c === "group" ? ICON.doc : ICON.flight) + esc(title[c] || c) + '</div>' +
          rows.map(function (r) { return '<div class="bk"><div><div class="small muted">' + esc(r.label) + '</div><div class="v">' + esc(r.value) + '</div></div>' +
            '<button class="iconbtn" data-copy="' + esc(String(r.value).replace(/^(PNR|E-ticket|Hotel confirmation)\s*/, "")) + '" aria-label="Copy">⧉</button></div>'; }).join("") +
          files.map(function (r) { return '<div class="actions"><button class="btn primary" data-file="' + esc(r.file.id) + '" data-ftype="' + esc(r.file.type) + '">' + ICON.doc + 'View full ' + (/pdf/.test(r.file.type) ? "PDF" : "image") + '</button></div><div id="f_' + esc(r.file.id) + '"></div>'; }).join("") + '</div>';
      }).join("") + '<div class="actions"><button class="btn" data-lock="1">Lock on this phone</button></div>');
    }
    if (k === "transport") return infoSheet("Transport 交通",
      '<div class="card" style="margin-bottom:10px"><div class="kind k-travel">' + ICON.train + '1 · MRT 捷運</div><div style="margin-top:6px"><b>Hotel station:</b> Shandao Temple 善導寺</div>' +
        '<div class="actions" style="margin-top:6px">' + recChips("shandao") + '</div><div class="small muted" style="margin-top:6px">' + esc(T.stations.shandao.note) + ' · Avoid ' + esc(T.stations.shandao.avoid.join(", ")) + '</div>' +
        '<div class="actions"><button class="btn" data-mrt="shandao">' + ICON.train + 'All exits</button></div></div>' +
      '<div class="card" style="margin-bottom:10px"><div class="kind k-travel">' + ICON.taxi + '2 · Taxi / Uber 計程車</div><div class="small muted" style="margin-top:6px">4 people fit one taxi. Every place has a “Taxi card” with the Chinese address.</div><div class="actions"><a class="btn" href="https://m.uber.com/" target="_blank" rel="noopener">Uber</a><a class="btn" href="https://www.taiwantaxi.com.tw/" target="_blank" rel="noopener">55688 Taiwan Taxi</a></div></div>' +
      '<div class="card"><div class="kind k-travel">' + ICON.flight + '3 · Airport transport 機場接送</div><div class="small muted" style="margin-top:6px"><b>Taiwan (Klook van, max 7 pax, 8 bags):</b> 3 Jan meet the driver after customs, Arrival Hall near Gates 21–22 (voucher says Terminal 1, we land at Terminal 2: confirm with the operator); driver waits up to 90 min after landing · 8 Jan pick-up at the hotel lobby 13:30, be there by 13:15 (driver waits 15 min) · ~50–60 min · Driver details arrive 3 h–1 day before</div><div class="small muted" style="margin-top:6px"><b>Singapore (Kelvin):</b> 3 Jan ~08:00 home → Changi T3 · 8 Jan Changi → home after SQ879 lands 22:20</div><div class="small muted" style="margin-top:6px">Booking numbers, operator phone and pick-up addresses: Bookings (after the group code).</div><div class="actions"><button class="btn" data-home="bookings">' + ICON.doc + 'Bookings</button></div></div>');
    if (k === "weather") return infoSheet("Weather 天氣", '<div class="card">' + T.days.map(function (d) { var w = wxFor(d.date), c = w ? WMO(w.code) : ["☁️", "Jan average"];
        return '<div class="wx"><span class="ico">' + c[0] + '</span><div><b>' + esc(d.dow) + ' ' + (+d.date.slice(8)) + ' Jan</b><div class="small muted">' + esc(c[1]) + ' · ' + esc((d.areas || [])[0] || "") + '</div></div><b>' + (w ? Math.round(w.min) + '–' + Math.round(w.max) + '°C<div class="small muted">rain ' + w.pop + '%</div>' : '~17–21°C') + '</b></div>'; }).join("") +
      '</div><div class="card" style="margin-top:10px">' + esc(T.weather_note) + '<div class="small muted" style="margin-top:8px">' + esc(WX.note || ("Forecast: Open-Meteo, updated " + (WX.fetched ? new Date(WX.fetched).toLocaleString("en-GB") : "—"))) + '</div></div>');
    if (k === "messages") { state.tab = "messages"; return render(); }
    if (k === "messages_old") return infoSheet("Messages 公告", '<div class="card"><div class="muted">Group noticeboard: post once, everyone sees it as a banner (B4).</div></div>');
    if (k === "help") { state.tab = "help"; return render(); }
    if (k === "tobook") return infoSheet("To book / confirm", '<div class="card">' + T.to_book.map(function (x) { return '<div class="pick"><div class="grow small">' + esc(x) + '</div></div>'; }).join("") + '</div>');
  }

  var FORM = {};
  function keepForm() { ["who", "lname", "lcomment", "samt", "snote"].forEach(function (id) { var el = $(id); if (el) FORM[id] = el.value; }); }
  function restoreForm() { Object.keys(FORM).forEach(function (id) { var el = $(id); if (el) el.value = FORM[id]; }); }
  document.addEventListener("change", function (e) {
    var t = e.target; if (!t.files || !t.files[0]) return;
    if (t.id !== "lphoto" && t.id !== "sphoto") return;
    keepForm();
    resizePhoto(t.files[0], 1280).then(function (url) {
      if (t.id === "lphoto") { LOG.draft.photo = url; renderLog(); } else { SPEND.draft.photo = url; renderSpend(); }
      restoreForm();
    }, function () { toast("Could not read the photo"); });
  });
  // ---------- frame ----------
  var TABS = [["home", "Home"], ["plan", "Plan"], ["map", "Map"], ["log", "Log"], ["spend", "Spend"]];
  function render() {
    $("tabs").innerHTML = TABS.map(function (t) { return '<button class="tab ' + (state.tab === t[0] ? "on" : "") + '" data-tab="' + t[0] + '">' + ICON[t[0]] + '<span>' + t[1] + '</span></button>'; }).join("");
    if (state.tab === "home") renderHome(); else if (state.tab === "plan") renderPlan(); else if (state.tab === "map") renderMap(); else if (state.tab === "help") renderHelp();
    else if (state.tab === "log") renderLog(); else if (state.tab === "spend") renderSpend(); else if (state.tab === "messages") renderMessages(); else renderSoon(state.tab);
    window.scrollTo(0, 0);
  }
  function renderPreview() {
    $("previewStrip").innerHTML = '<b>Before the trip · preview</b>' + T.days.map(function (d, i) {
      return '<button class="chip ' + (state.previewIdx === i ? "on" : "") + '" data-pday="' + i + '">' + d.dow + ' ' + dayLabel(d).dd + '</button>';
    }).join("");
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button,[data-tab],[data-day],[data-home]"); if (!b) return;
    if (b.dataset.tab) { state.tab = b.dataset.tab; render(); }
    else if (b.dataset.day) { state.day = +b.dataset.day; renderPlan(); }
    else if (b.dataset.icat) { state.ideaCat = b.dataset.icat; renderPlan(); }
    else if (b.dataset.plus) infoSheet("Add to the trip", '<div class="card"><div class="muted">Swap a spare day or a day trip from Ideas into one of the days.</div><div class="actions"><button class="btn primary" data-mode="ideas" data-close>Open Ideas</button></div><div class="small muted" style="margin-top:8px">In Ideas, open a spare day or day trip and tap “Swap into a day”.</div></div>');
    else if (b.dataset.unlock) {
      var v = (($("gcode") || {}).value || "").trim(); if (!v) return toast("Enter the group code first");
      b.disabled = true; b.textContent = "Checking…";
      doUnlock(v).then(function (ok) { if (!ok) { b.disabled = false; b.textContent = "Unlock"; return; } toast("Unlocked on this phone");
        if (b.dataset.unlock === "bookings") homeShortcut("bookings"); else { closeSheet(); render(); } });
    }
    else if (b.dataset.lock) { ls("trip.groupCode", null); ls("trip.ownerCode", null); AUTH = { code: "", owner: "", ok: false, isOwner: false, bookings: null }; closeSheet(); render(); toast("Locked on this phone"); }
    else if (b.dataset.copy) { (navigator.clipboard ? navigator.clipboard.writeText(b.dataset.copy) : Promise.reject()).then(function () { toast("Copied"); }, function () { toast(b.dataset.copy); }); }
    else if (b.dataset.file) {
      var box = $("f_" + b.dataset.file); b.disabled = true; b.textContent = "Loading…";
      api("file", { id: b.dataset.file }).then(function (j) {
        b.disabled = false; b.textContent = "Loaded";
        if (!j.ok) return toast("Could not load: " + j.error);
        var bin = atob(j.data), arr = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        var url = URL.createObjectURL(new Blob([arr], { type: j.type }));
        if (box) box.innerHTML = /pdf/.test(j.type) ? '<div class="actions"><a class="btn primary" href="' + url + '" target="_blank" rel="noopener">Open PDF</a></div>' : '<a href="' + url + '" target="_blank" rel="noopener"><img class="thumb" src="' + url + '" alt="' + esc(j.name) + '"></a>';
      }, function () { b.disabled = false; b.textContent = "Try again"; toast("No connection"); });
    }
    else if (b.dataset.star) { LOG.draft.rating = +b.dataset.star; keepForm(); renderLog(); restoreForm(); }
    else if (b.dataset.loggps) {
      if (!("geolocation" in navigator)) return toast("No location support");
      keepForm(); toast("Finding you…");
      navigator.geolocation.getCurrentPosition(function (pos) { LOG.draft.gps = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy) }; renderLog(); restoreForm(); },
        function () { toast("Location is off — see Help"); }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
    }
    else if (b.dataset.logsave) {
      var nm = ($("lname").value || "").trim(), who = ($("who").value || "").trim();
      if (!nm && !LOG.draft.photo) return toast("Add a name or a photo");
      if (who) ls("trip.name", who);
      b.disabled = true; b.textContent = "Saving…";
      send("log_add", { by: who, name: nm, comment: $("lcomment").value, rating: LOG.draft.rating, gps: LOG.draft.gps, photo: LOG.draft.photo }).then(function (j) {
        b.disabled = false; b.textContent = "Save for the group";
        if (!j.ok) return toast("Not saved: " + j.error);
        toast(j.queued ? "No signal — saved on the phone, will sync" : "Saved for the group");
        LOG.draft = { rating: 0, photo: "", gps: null }; LOG.rows = null; FORM = {}; renderLog();
      });
    }
    else if (b.dataset.scat) { SPEND.draft.cat = b.dataset.scat; keepForm(); renderSpend(); restoreForm(); }
    else if (b.dataset.owner) {
      var oc = (($("ocode") || {}).value || "").trim(); if (!oc) return toast("Enter the owner code");
      AUTH.owner = oc; api("check").then(function (j) { if (j.ok && j.owner) { AUTH.isOwner = true; ls("trip.ownerCode", oc); renderSpend(); } else { AUTH.owner = ""; toast("Wrong owner code"); } }, function () { toast("No connection"); });
    }
    else if (b.dataset.ssave) {
      var amt = parseFloat($("samt").value); if (!(amt > 0)) return toast("Enter the amount");
      b.disabled = true; b.textContent = "Saving…";
      send("spend_add", { amount: amt, currency: "TWD", category: SPEND.draft.cat, note: $("snote").value, date: taipeiDate(), photo: SPEND.draft.photo }).then(function (j) {
        b.disabled = false; b.textContent = "Save";
        if (!j.ok) return toast("Not saved: " + j.error);
        toast(j.queued ? "No signal — saved on the phone, will sync" : "Saved"); SPEND.draft = { cat: SPEND.draft.cat, photo: "" }; SPEND.rows = null; FORM = {}; renderSpend();
      });
    }
    else if (b.dataset.srate) { ls("trip.rate", String(parseFloat($("srate").value) || "")); renderSpend(); }
    else if (b.dataset.sdel) { api("spend_del", { id: b.dataset.sdel }).then(function (j) { if (j.ok) { SPEND.rows = null; renderSpend(); } else toast(j.error); }); }
    else if (b.dataset.install) { if (INSTALL.prompt) { INSTALL.prompt.prompt(); INSTALL.prompt.userChoice.then(function () { INSTALL.prompt = null; renderHome(); }); } }
    else if (b.dataset.installhide) { ls("trip.installHide", "1"); renderHome(); }
    else if (b.dataset.mdel) {
      if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Tap again to delete"; b.style.borderColor = "var(--bad)"; b.style.color = "var(--bad)"; setTimeout(function () { if (b.isConnected) { delete b.dataset.armed; b.textContent = "Delete"; b.style.cssText = ""; } }, 4000); return; }
      b.disabled = true; b.textContent = "Deleting…";
      api("msg_del", { id: b.dataset.mdel }).then(function (j) { if (!j.ok) { b.disabled = false; b.textContent = "Delete"; return toast(j.error === "unknown action" ? "Delete needs the backend update (pending)" : "Not deleted: " + j.error); }
        MSG.rows = MSG.rows.filter(function (r) { return r.id !== b.dataset.mdel; }); MSG.sig = ""; renderMessages(); toast("Message deleted"); pollMessages(); }, function () { b.disabled = false; b.textContent = "Delete"; toast("No connection"); });
    }
    else if (b.dataset.msend) {
      var tx = ($("mtext").value || "").trim(), wh = ($("who").value || "").trim(); if (!tx) return toast("Write a message");
      if (wh) ls("trip.name", wh);
      b.disabled = true;
      send("msg_add", { by: wh, text: tx }).then(function (j) { b.disabled = false; if (!j.ok) return toast(j.error); toast(j.queued ? "No signal — will send later" : "Sent to the group"); pollMessages(); $("mtext").value = ""; });
    }
    else if (b.dataset.mode) { state.planMode = b.dataset.mode; renderPlan(); window.scrollTo(0, 0); }
    else if (b.dataset.taxi) taxiSheet(b.dataset.taxi);
    else if (b.dataset.mrt) mrtSheet(b.dataset.mrt);
    else if (b.dataset.home) homeShortcut(b.dataset.home);
    else if (b.dataset.goplan) { state.tab = "plan"; state.planMode = "itin"; state.day = +b.dataset.goplan; render(); }
    else if (b.dataset.swap) {
      var idea = ideaById(b.dataset.swap), allowed = idea.swap_into || ["2027-01-05", "2027-01-06", "2027-01-07"];
      infoSheet("Swap “" + esc(idea.title) + "” into…", '<div class="small muted">Replaces that day\'s plan on this phone (shared with the group in B4). The original plan stays saved — tap Undo on that day to restore it. An idea can be in one day at a time.</div>' +
        allowed.map(function (dt) { var i = T.days.map(function (d) { return d.date; }).indexOf(dt), d = T.days[i]; return '<button class="phr" data-swapto="' + dt + '" data-swapid="' + idea.id + '"><div class="zh" style="font-size:19px">' + esc(d.dow) + ' ' + (+dt.slice(8)) + ' Jan</div><div class="en">Now: ' + esc(d.title) + '</div></button>'; }).join(""));
    }
    else if (b.dataset.swapto) { var sw = loadSwaps(); Object.keys(sw).forEach(function (k) { if (sw[k] === b.dataset.swapid) delete sw[k]; }); sw[b.dataset.swapto] = b.dataset.swapid; saveSwaps(sw); closeSheet(); state.tab = "plan"; state.planMode = "itin"; state.day = T.days.map(function (d) { return d.date; }).indexOf(b.dataset.swapto); render(); toast("Swapped — Undo is at the top of the day"); }
    else if (b.dataset.unswap) { var sw2 = loadSwaps(); delete sw2[b.dataset.unswap]; saveSwaps(sw2); renderPlan(); toast("Back to the original plan"); }
    else if (b.dataset.mapf) { state.mapFilter = b.dataset.mapf; renderMap(); }
    else if (b.dataset.gps) locate(b.dataset.gps);
    else if (b.dataset.phr) { var ph = PHRASES[+b.dataset.phr]; infoSheet("", '<div class="bigsay">' + esc(ph[0]) + '</div><div class="muted" style="font-size:19px">' + esc(ph[1]) + '</div>'); }
    else if (b.dataset.pday) { state.previewIdx = +b.dataset.pday; renderPreview(); if (state.tab === "home") renderHome(); }
    else if (b.id === "langBtn") toast("Names always show English first, then 中文");
  });

  fetch("data/trip.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
    T = j; setOffline(); loadWeather(); renderPreview(); render();
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
    if (AUTH.code) api("unlock").then(function (k) { if (k.ok) { AUTH.ok = true; AUTH.bookings = k.rows; if (AUTH.owner) api("check").then(function (c) { AUTH.isOwner = !!(c.ok && c.owner); if (state.tab === "spend") renderSpend(); }); pollMessages(); if (state.tab === "home") renderHome(); } }, function () { AUTH.ok = !!AUTH.code; });
    setInterval(function () { if (document.visibilityState === "visible") pollMessages(); }, 60000);
    window.addEventListener("online", flushQueue);
  }).catch(function (err) { $("view").innerHTML = '<div class="loading">Could not load trip data: ' + esc(err.message) + '</div>'; });
})();
</script>
</body>
</html>
