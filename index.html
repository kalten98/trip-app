<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Taipei Trip 台北</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f7; --card: #ffffff; --ink: #1b1d21; --muted: #5f6672; --line: #e7e9ee;
    --accent: #ff5a1f; --accent-soft: #fff1ea; --teal: #0e9f8a; --teal-soft: #e6f6f3;
    --blue: #2f6fec; --blue-soft: #eaf1fe; --violet: #7b5cf0; --violet-soft: #f1edfe;
    --amber: #e8a100; --amber-soft: #fff6dd; --rose: #e2456b; --rose-soft: #fdebf0;
    --warn: #b45309; --warn-soft: #fff4e0; --ok: #15803d; --ok-soft: #e8f7ee; --bad: #b91c1c; --bad-soft: #fdecec;
    --radius: 18px; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.06);
    --tab-h: 74px;
    --font: "Plus Jakarta Sans", "Noto Sans TC", sans-serif;
    --font-zh: "Noto Sans TC", "Plus Jakarta Sans", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 500 17px/1.45 var(--font); }
  body { padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom)); overflow-x: hidden; }
  .zh { font-family: var(--font-zh); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }

  /* ---------- top bar ---------- */
  .top { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.94); backdrop-filter: blur(10px);
         border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
  .top .wrap { display: flex; align-items: center; gap: 12px; height: 60px; }
  .brand { font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
  .brand small { display: block; font-weight: 600; font-size: 16px; color: var(--muted); letter-spacing: 0; }
  .top .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff;
          border-radius: 999px; padding: 7px 12px; font-size: 16px; font-weight: 600; cursor: pointer; white-space: nowrap; }

  /* ---------- preview-day strip (mock only) ---------- */
  .preview { background: var(--violet-soft); border-bottom: 1px solid #e3dbfd; }
  .preview .wrap { display: flex; gap: 8px; align-items: center; overflow-x: auto; padding-top: 8px; padding-bottom: 8px; scrollbar-width: none; }
  .preview .wrap::-webkit-scrollbar { display: none; }
  .preview b { color: var(--violet); font-size: 16px; white-space: nowrap; }
  .chip { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px;
          font-size: 16px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* ---------- cards ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .section { margin-top: 18px; }
  .section h2 { font-size: 20px; font-weight: 800; margin: 0 0 10px; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 8px; }
  .section h2 .zh { font-size: 17px; color: var(--muted); font-weight: 700; }
  .muted { color: var(--muted); }
  .small { font-size: 16px; }

  /* ---------- hero ---------- */
  .hero { margin-top: 14px; border-radius: 22px; padding: 18px; color: #fff; position: relative; overflow: hidden;
          background: radial-gradient(120% 140% at 100% 0%, #ffb26b 0%, #ff6a2b 45%, #e5432c 100%); box-shadow: var(--shadow); }
  .hero::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 220px; height: 220px; border-radius: 50%;
                 background: rgba(255,255,255,.12); }
  .hero .kicker { font-size: 16px; font-weight: 700; opacity: .92; }
  .hero h1 { margin: 4px 0 2px; font-size: 27px; line-height: 1.15; letter-spacing: -.02em; font-weight: 800; }
  .hero .sub { font-size: 17px; opacity: .95; }
  .hero .stats { display: flex; gap: 10px; margin-top: 14px; position: relative; z-index: 1; flex-wrap: wrap; }
  .hero .stat { background: rgba(255,255,255,.18); border-radius: 12px; padding: 8px 12px; font-size: 16px; font-weight: 700; }

  /* ---------- icon row ---------- */
  .icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .ic { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 0; cursor: pointer; }
  .ic .tile { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; }
  .ic svg { width: 28px; height: 28px; }
  .ic span { font-size: 16px; font-weight: 700; }
  .t-orange { background: var(--accent-soft); color: var(--accent); } .t-teal { background: var(--teal-soft); color: var(--teal); }
  .t-blue { background: var(--blue-soft); color: var(--blue); } .t-violet { background: var(--violet-soft); color: var(--violet); }
  .t-amber { background: var(--amber-soft); color: var(--amber); } .t-rose { background: var(--rose-soft); color: var(--rose); }

  /* ---------- next-up ---------- */
  .next .label { font-size: 16px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
  .next .time { font-size: 31px; font-weight: 800; letter-spacing: -.02em; }
  .next .what { font-size: 19px; font-weight: 700; margin-top: 2px; }
  .names { margin-top: 6px; }
  .names .en { font-weight: 700; font-size: 17px; }
  .names .zh { font-size: 17px; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px;
         border-radius: 12px; border: 1px solid var(--line); background: #fff; font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn svg { width: 18px; height: 18px; }

  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 700; border-radius: 8px; padding: 2px 8px; }
  .b-warn { background: var(--warn-soft); color: var(--warn); } .b-ok { background: var(--ok-soft); color: var(--ok); }
  .b-bad { background: var(--bad-soft); color: var(--bad); } .b-info { background: var(--blue-soft); color: var(--blue); }

  /* ---------- horizontal cards ---------- */
  .hscroll { display: flex; gap: 10px; overflow-x: auto; padding: 2px 16px 6px; margin: 0 -16px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .hscroll::-webkit-scrollbar { display: none; }
  .mini { flex: none; width: 70%; max-width: 260px; scroll-snap-align: start; }
  .mini .t { font-weight: 800; font-size: 17px; }
  .mini .d { font-size: 16px; color: var(--muted); margin-top: 2px; }

  /* ---------- plan ---------- */
  .daytabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px; margin: 0 -16px; scrollbar-width: none; }
  .daytabs::-webkit-scrollbar { display: none; }
  .dt { flex: none; min-width: 64px; text-align: center; border-radius: 14px; background: #fff; border: 1px solid var(--line);
        padding: 8px 10px; cursor: pointer; }
  .dt .dw { font-size: 16px; font-weight: 700; color: var(--muted); }
  .dt .dd { font-size: 21px; font-weight: 800; }
  .dt.on { background: var(--ink); border-color: var(--ink); color: #fff; } .dt.on .dw { color: #d7dbe2; }
  .dt.spare { border-style: dashed; }
  .dayhead h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
  .dayhead .zh { font-size: 18px; color: var(--muted); font-weight: 700; }
  .note { display: flex; gap: 10px; align-items: flex-start; border-radius: 14px; padding: 12px; font-size: 16px; margin-top: 10px; }
  .note svg { flex: none; width: 20px; height: 20px; margin-top: 1px; }
  .n-rain { background: var(--blue-soft); color: #1d4ed8; } .n-mrt { background: var(--teal-soft); color: #0b6b5d; }
  .n-why { background: var(--amber-soft); color: #8a5a00; }

  .timeline { position: relative; margin-top: 14px; }
  .item { display: grid; grid-template-columns: 56px 1fr; gap: 10px; position: relative; }
  .item + .item { margin-top: 10px; }
  .item .tm { font-weight: 800; font-size: 17px; padding-top: 14px; text-align: right; }
  .item .card { padding: 14px; }
  .kind { display: inline-flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 800; }
  .kind svg { width: 18px; height: 18px; }
  .k-visit { color: var(--blue); } .k-meal { color: var(--accent); } .k-travel { color: var(--teal); } .k-rest { color: var(--violet); }
  .k-hotel { color: var(--violet); } .k-flight { color: var(--ink); }
  .item .txt { font-weight: 700; font-size: 17px; margin-top: 4px; }
  .item .tr { font-size: 16px; color: var(--muted); margin-top: 4px; }

  .meal-opts { display: grid; gap: 8px; margin-top: 10px; }
  .opt { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
  .opt .tag { font-size: 16px; font-weight: 800; border-radius: 8px; padding: 2px 8px; }
  .opt.main { border-color: #ffd2bf; background: var(--accent-soft); }
  .opt.main .tag { background: var(--accent); color: #fff; } .opt .tag { background: #eef0f3; color: var(--muted); }
  .opt .nm .en { font-weight: 700; font-size: 16px; } .opt .nm .zh { font-size: 16px; color: var(--muted); }
  .iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; cursor: pointer; }
  .iconbtn svg { width: 20px; height: 20px; }

  details.picks { margin-top: 14px; }
  details.picks summary { list-style: none; cursor: pointer; font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  details.picks summary::-webkit-details-marker { display: none; }
  .pick { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .pick:first-of-type { border-top: 0; }
  .pick .grow { flex: 1; min-width: 0; }
  .pick .en { font-weight: 700; font-size: 16px; } .pick .zh { font-size: 16px; color: var(--muted); }

  /* ---------- placeholder tabs ---------- */
  .soon { text-align: center; padding: 40px 18px; }
  .soon svg { width: 54px; height: 54px; color: var(--muted); }
  .soon h2 { margin: 10px 0 6px; font-size: 22px; }

  /* ---------- tab bar ---------- */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 1px solid var(--line);
            padding-bottom: env(safe-area-inset-bottom); }
  .tabbar .wrap { display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tab-h); padding: 0 4px; }
  .tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: #8a909b; }
  .tab svg { width: 26px; height: 26px; }
  .tab span { font-size: 16px; font-weight: 700; }
  .tab.on { color: var(--accent); }

  /* ---------- sheets (taxi / mrt / info) ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(15,18,25,.45); z-index: 40; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: #fff; border-radius: 22px 22px 0 0;
           max-height: 88vh; overflow-y: auto; padding: 10px 0 calc(18px + env(safe-area-inset-bottom)); transform: translateY(110%); transition: transform .25s ease; }
  .sheet.open { transform: none; } .scrim.open { display: block; }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: #d9dce2; margin: 4px auto 10px; }
  .taxi-zh { font-family: var(--font-zh); font-size: 33px; font-weight: 700; line-height: 1.3; margin: 8px 0; word-break: break-word; }
  .taxi-say { font-family: var(--font-zh); font-size: 23px; font-weight: 700; color: var(--accent); }
  .exit { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .exit .no { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; }
  .exit.ok .no { background: var(--ok-soft); color: var(--ok); } .exit.bad .no { background: var(--bad-soft); color: var(--bad); }
  .exit.rec .no { background: var(--ok); color: #fff; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
           background: var(--ink); color: #fff; border-radius: 12px; padding: 10px 14px; font-size: 16px; font-weight: 600; z-index: 50;
           opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.on { opacity: 1; }
  .loading { padding: 60px 16px; text-align: center; color: var(--muted); }
  .mtabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); margin: 6px -16px 0; padding: 0 16px; background: #fff; }
  .mtabs button { border: 0; background: none; min-height: 52px; font-size: 19px; font-weight: 600; color: var(--ink); cursor: pointer; position: relative; }
  .mtabs button.on { font-weight: 800; }
  .mtabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 4px; border-radius: 2px; background: var(--ink); }
  .crow { display: flex; gap: 10px; align-items: center; overflow-x: auto; padding: 14px 16px 6px; margin: 0 -16px; scrollbar-width: none; }
  .crow::-webkit-scrollbar { display: none; }
  .cp { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #d6d9df;
        background: #fff; font-size: 18px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--ink); }
  .cp svg { width: 20px; height: 20px; }
  .cp.on { background: #141a26; border-color: #141a26; color: #fff; }
  .cplus { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #e9ebf0; display: grid; place-items: center; cursor: pointer; }
  .cplus svg { width: 22px; height: 22px; }
  .ovday { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; cursor: pointer; }
  .ovday .dd { text-align: center; border-radius: 14px; background: var(--bg); padding: 6px 0; }
  .ovday .dd b { display: block; font-size: 23px; line-height: 1.1; } .ovday .dd span { font-size: 16px; color: var(--muted); font-weight: 700; }
  .ovday .t { font-weight: 800; font-size: 18px; } .ovday .s { font-size: 16px; color: var(--muted); }
  .codebox { width: 100%; min-height: 50px; border: 1.5px solid #d6d9df; border-radius: 12px; padding: 0 14px; font: 700 20px var(--font); letter-spacing: .12em; margin-top: 10px; }
  .mapwrap { position: relative; margin: 10px -16px 0; isolation: isolate; z-index: 0; }
  #map { height: calc(100vh - 230px - env(safe-area-inset-bottom)); min-height: 380px; background: #e8ecef; }
  .mapbtn { position: absolute; right: 12px; bottom: 16px; z-index: 500; }
  .leaflet-popup-content { font: 600 16px/1.4 var(--font); margin: 12px 14px; }
  .leaflet-popup-content .zh { color: var(--muted); }
  .leaflet-popup-content .btn { min-height: 40px; padding: 0 10px; font-size: 16px; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 16px; margin-top: 8px; }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 4px; vertical-align: -2px; }
  .phr { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 14px; margin-top: 8px; cursor: pointer; }
  .phr .zh { font-size: 21px; font-weight: 700; color: var(--ink); } .phr .en { font-size: 16px; color: var(--muted); }
  .bigsay { font-family: var(--font-zh); font-size: 40px; font-weight: 700; line-height: 1.3; margin: 10px 0; }
  .swapbar svg { width: 22px; height: 22px; flex: none; }
  .lock span svg { width: 26px; height: 26px; }
  .swapbar { display: flex; align-items: center; gap: 10px; background: var(--violet-soft); color: #4c32c7; border-radius: 14px; padding: 12px; margin-top: 10px; font-size: 16px; font-weight: 700; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: #e9ebf0; border-radius: 14px; padding: 4px; margin-top: 14px; }
  .seg button { border: 0; background: none; border-radius: 11px; min-height: 42px; font-weight: 800; font-size: 17px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(16,24,40,.12); }
  .mi { display: inline-flex; align-items: center; gap: 3px; font-weight: 800; font-size: 16px; border-radius: 8px; padding: 2px 7px; }
  .mi svg { width: 17px; height: 17px; }
  .mi.lift { background: var(--blue-soft); color: var(--blue); } .mi.esc { background: var(--teal-soft); color: var(--teal); }
  .mi.stairs { background: var(--bad-soft); color: var(--bad); }
  .mrtbtn { width: 100%; justify-content: flex-start; flex-wrap: wrap; gap: 8px 12px; padding: 8px 12px; text-align: left; }
  .mrtname { display: inline-flex; align-items: center; gap: 6px; width: 100%; }
  .exitchips { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .idea { margin-top: 10px; }
  .idea summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .idea summary::-webkit-details-marker { display: none; }
  .idea summary .t { font-weight: 800; font-size: 18px; } .idea summary .s { font-size: 16px; color: var(--muted); }
  .idea[open] summary { margin-bottom: 8px; }
  .lock { display: flex; align-items: center; gap: 12px; }
  .lock .n { font-size: 23px; font-weight: 800; letter-spacing: .04em; }
  .hero .now { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.22); border-radius: 999px; padding: 4px 10px; font-size: 16px; font-weight: 800; }
  .hero .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.3); }
  .hero .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); margin-top: 12px; overflow: hidden; position: relative; z-index: 1; }
  .hero .bar i { display: block; height: 100%; background: #fff; border-radius: 3px; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">Taipei 台北<small>3–8 Jan 2027</small></div>
    <div class="spacer"></div>
    <button class="pill" id="langBtn" title="Mock only">EN · 中文</button>
  </div>
</header>
<div class="preview">
  <div class="wrap" id="previewStrip"><b>Mock · preview as</b></div>
</div>

<main class="wrap" id="view"><div class="loading">Loading trip…</div></main>

<nav class="tabbar">
  <div class="wrap" id="tabs"></div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="wrap" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  // ---------- icons (inline, stroke) ----------
  var I = function (d) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>'; };
  var ICON = {
    home: I('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>'),
    plan: I('<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M7.5 13h3M7.5 17h6"/>'),
    map: I('<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/>'),
    log: I('<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/>'),
    spend: I('<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h4"/>'),
    flight: I('<path d="M2.5 13.5 21 7.5c.9-.3 1.6.8.9 1.5L13 17l-2.5 4-1.5-.5.8-4.3-4.3 1-1.5 2-1.3-.4.6-3.5L2 14.6l.5-1.1Z"/>'),
    hotel: I('<path d="M3 20V6M3 13h18v7M21 13a3 3 0 0 0-3-3h-7v3"/><circle cx="7" cy="10" r="2"/>'),
    doc: I('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>'),
    taxi: I('<path d="M5 11 6.5 6.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11"/><rect x="3" y="11" width="18" height="6" rx="2"/><path d="M6 17v2M18 17v2M7 14h.01M17 14h.01M10 3h4"/>'),

    if (b.dataset.tab) { state.tab = b.dataset.tab; render(); }
    else if (b.dataset.day) { state.day = +b.dataset.day; renderPlan(); }
    else if (b.dataset.icat) { state.ideaCat = b.dataset.icat; renderPlan(); }
    else if (b.dataset.plus) infoSheet("Add to the trip", '<div class="card"><div class="muted">Swap a spare day or a day trip from Ideas into one of the days.</div><div class="actions"><button class="btn primary" data-mode="ideas" data-close>Open Ideas</button></div><div class="small muted" style="margin-top:8px">In Ideas, open a spare day or day trip and tap “Swap into a day”.</div></div>');
    else if (b.dataset.unlock) { var v = ($("gcode") || {}).value || ""; try { if (v) localStorage.setItem("trip.groupCode", v); } catch (e) {} closeSheet(); toast(v ? "Code saved on this phone — booking details connect in B4" : "Enter the group code first"); }
    else if (b.dataset.mode) { state.planMode = b.dataset.mode; renderPlan(); window.scrollTo(0, 0); }
    else if (b.dataset.taxi) taxiSheet(b.dataset.taxi);
    else if (b.dataset.mrt) mrtSheet(b.dataset.mrt);
    else if (b.dataset.home) homeShortcut(b.dataset.home);
    else if (b.dataset.goplan) { state.tab = "plan"; state.planMode = "itin"; state.day = +b.dataset.goplan; render(); }
    else if (b.dataset.swap) {
      var idea = ideaById(b.dataset.swap), allowed = idea.swap_into || ["2027-01-05", "2027-01-06", "2027-01-07"];
      infoSheet("Swap “" + esc(idea.title) + "” into…", '<div class="small muted">Replaces that day\'s plan on this phone (shared with the group in B4). The original plan stays saved — tap Undo on that day to restore it. An idea can be in one day at a time.</div>' +
        allowed.map(function (dt) { var i = T.days.map(function (d) { return d.date; }).indexOf(dt), d = T.days[i]; return '<button class="phr" data-swapto="' + dt + '" data-swapid="' + idea.id + '"><div class="zh" style="font-size:19px">' + esc(d.dow) + ' ' + (+dt.slice(8)) + ' Jan</div><div class="en">Now: ' + esc(d.title) + '</div></button>'; }).join(""));
    }
    else if (b.dataset.swapto) { var sw = loadSwaps(); Object.keys(sw).forEach(function (k) { if (sw[k] === b.dataset.swapid) delete sw[k]; }); sw[b.dataset.swapto] = b.dataset.swapid; saveSwaps(sw); closeSheet(); state.tab = "plan"; state.planMode = "itin"; state.day = T.days.map(function (d) { return d.date; }).indexOf(b.dataset.swapto); render(); toast("Swapped — Undo is at the top of the day"); }
    else if (b.dataset.unswap) { var sw2 = loadSwaps(); delete sw2[b.dataset.unswap]; saveSwaps(sw2); renderPlan(); toast("Back to the original plan"); }
    else if (b.dataset.mapf) { state.mapFilter = b.dataset.mapf; renderMap(); }
    else if (b.dataset.gps) locate(b.dataset.gps);
    else if (b.dataset.phr) { var ph = PHRASES[+b.dataset.phr]; infoSheet("", '<div class="bigsay">' + esc(ph[0]) + '</div><div class="muted" style="font-size:19px">' + esc(ph[1]) + '</div>'); }
    else if (b.dataset.pday) { state.previewIdx = +b.dataset.pday; renderPreview(); if (state.tab === "home") renderHome(); }
    else if (b.id === "langBtn") toast("Names always show English first, then 中文");
  });

  fetch("data/trip.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
    T = j; renderPreview(); render();
  }).catch(function (err) { $("view").innerHTML = '<div class="loading">Could not load trip data: ' + esc(err.message) + '</div>'; });
})();
</script>
</body>
</html>
