<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip App</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d1d1f; --muted:#6b7280; --accent:#ff5b00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111214; --card:#1c1d20; --ink:#f3f4f6; --muted:#9ca3af; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:32px 16px; }
  .card { background:var(--card); border-radius:16px; padding:20px; }
  a { color:var(--accent); font-weight:600; }
  p { color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Trip App</h1>
    <p>Under construction. Phone test page:</p>
    <a href="probe/">Open the phone test (B0)</a>
  </div>
</main>
</body>
</html>
