<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip App Probe</title>
<style>
  :root { --bg:#f6f7f9; --card:#ffffff; --ink:#1d1d1f; --muted:#6b7280; --line:#e5e7eb; --accent:#ff5b00; --ok:#16a34a; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111214; --card:#1c1d20; --ink:#f3f4f6; --muted:#9ca3af; --line:#2c2e33; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif; }
  header { padding:20px 16px 8px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { margin:0; color:var(--muted); font-size:14px; }
  main { padding:8px 16px 40px; display:grid; gap:12px; max-width:560px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .card h2 { font-size:17px; margin:0 0 8px; display:flex; justify-content:space-between; align-items:center; }
  .pill { font-size:12px; padding:3px 10px; border-radius:999px; background:var(--line); color:var(--muted); }
  .pill.ok { background:#dcfce7; color:var(--ok); } .pill.bad { background:#fee2e2; color:var(--bad); }
  button, label.btn { display:inline-block; border:0; border-radius:12px; background:var(--accent); color:#fff; font-size:16px; font-weight:600; padding:12px 16px; cursor:pointer; }
  input[type=text], input[type=password] { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:16px; background:var(--card); color:var(--ink); margin:6px 0; }
  .out { font-size:14px; color:var(--muted); word-break:break-all; margin-top:8px; }
  img.prev { max-width:100%; border-radius:10px; margin-top:8px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Trip App · Phone Test (B0)</h1>
  <p class="sub">Tests 3 things on this phone: location, camera, saving to Google Drive.</p>
</header>
<main>
  <section class="card">
    <h2>1 · Location <span id="gpsPill" class="pill">not tested</span></h2>
    <button id="gpsBtn">Get my location</button>
    <div id="gpsOut" class="out"></div>
  </section>

  <section class="card">
    <h2>2 · Camera <span id="camPill" class="pill">not tested</span></h2>
    <label class="btn" for="camInput">Take a photo</label>
    <input id="camInput" type="file" accept="image/*" capture="environment" hidden>
    <div id="camOut" class="out"></div>
    <img id="camPrev" class="prev" alt="" hidden>
  </section>

  <section class="card">
    <h2>3 · Save to Drive <span id="bePill" class="pill">not tested</span></h2>
    <input id="beUrl" type="text" placeholder="Backend link (Apps Script web app URL)" autocomplete="off">
    <input id="beCode" type="password" placeholder="Group code" autocomplete="off">
    <button id="beBtn">Send test (location + photo)</button>
    <div id="beOut" class="out"></div>
  </section>

  <section class="card">
    <h2>Result</h2>
    <div id="summary" class="out">Run all 3 tests, then screenshot this page and send it to J T.</div>
  </section>
</main>
<script>
(function () {
  var state = { gps: null, photo: null, results: {} };
  function $(id) { return document.getElementById(id); }
  function mark(name, ok, msg) {
    var p = $(name + 'Pill'); p.textContent = ok ? 'PASS' : 'FAIL'; p.className = 'pill ' + (ok ? 'ok' : 'bad');
    $(name + 'Out').textContent = msg; state.results[name] = ok; summary();
  }
  function summary() {
    var r = state.results, keys = ['gps', 'cam', 'be'];
    $('summary').textContent = keys.map(function (k) { return k.toUpperCase() + ': ' + (k in r ? (r[k] ? 'PASS' : 'FAIL') : '—'); }).join(' · ') +
      ' · ' + navigator.userAgent.replace(/\s+/g, ' ').slice(0, 120);
  }
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  $('beUrl').value = load('probe.url');

  $('gpsBtn').onclick = function () {
    if (!('geolocation' in navigator)) return mark('gps', false, 'This browser has no location support.');
    $('gpsOut').textContent = 'Asking for location…';
    navigator.geolocation.getCurrentPosition(function (pos) {
      state.gps = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy) };
      mark('gps', true, state.gps.lat.toFixed(5) + ', ' + state.gps.lng.toFixed(5) + ' (±' + state.gps.acc + ' m)');
    }, function (err) { mark('gps', false, 'Error ' + err.code + ': ' + err.message); },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  };

  $('camInput').onchange = function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return mark('cam', false, 'No photo taken.');
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () {
      var max = 1280, s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      state.photo = c.toDataURL('image/jpeg', 0.8);
      $('camPrev').src = state.photo; $('camPrev').hidden = false; URL.revokeObjectURL(url);
      mark('cam', true, 'Photo ' + c.width + '×' + c.height + ', ~' + Math.round(state.photo.length * 0.75 / 1024) + ' KB after resize');
    };
    img.onerror = function () { mark('cam', false, 'Could not read the photo (' + (f.type || 'unknown type') + ').'); };
    img.src = url;
  };

  $('beBtn').onclick = function () {
    var url = $('beUrl').value.trim(), code = $('beCode').value.trim();
    if (!/^https:\/\/script\.google\.com\//.test(url)) return mark('be', false, 'Paste the Apps Script web app link (starts with https://script.google.com/).');
    if (!code) return mark('be', false, 'Enter the group code.');
    store('probe.url', url);
    $('beOut').textContent = 'Sending…';
    var body = JSON.stringify({ action: 'probe', code: code, gps: state.gps, photo: state.photo, ua: navigator.userAgent });
    fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) return mark('be', false, 'Backend said: ' + (j.error || 'unknown error'));
        return fetch(url + '?action=probeRead&code=' + encodeURIComponent(code)).then(function (r) { return r.json(); })
          .then(function (k) { mark('be', !!(k.ok && k.rows), 'Saved row ' + j.row + (j.photoUrl ? ' + photo in Drive' : ' (no photo sent)') + '; read back ' + (k.rows ? k.rows.length : 0) + ' rows.'); });
      })
      .catch(function (e) { mark('be', false, 'Network error: ' + e.message); });
  };
  summary();
})();
</script>
</body>
</html>
